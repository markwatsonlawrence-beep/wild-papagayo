    <style>
        :root{--navy:#062448;--gold:#C9A24B;--cream:#F7F4EE;--line:#e4dfd4}
        .plp-hero{background:var(--navy);color:#fff;text-align:center;padding:80px 0 0;position:relative;overflow:hidden}
        .plp-hero-inner{width:min(92%,780px);margin:0 auto;padding:0 0 44px}
        .plp-hero-eyebrow{font-family:'Playfair Display',Georgia,serif;font-size:clamp(1.8rem,4.5vw,3.2rem);line-height:1.15;margin:0 0 20px}
        .plp-hero-eyebrow span{display:block}
        .plp-hero-eyebrow span:first-child{color:rgba(255,255,255,.55);font-size:.55em;letter-spacing:.05em;text-transform:uppercase;margin-bottom:6px}
        .plp-hero h1{font-family:'Playfair Display',Georgia,serif;font-size:clamp(1.6rem,3.2vw,2.2rem);color:var(--gold);margin:0 0 16px;font-weight:600}
        .plp-hero-sub{color:rgba(255,255,255,.75);font-size:1.05rem;line-height:1.7;max-width:600px;margin:0 auto 30px}
        .plp-hero-actions{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
        .plp-hero-photo{width:100%;aspect-ratio:21/8;overflow:hidden;background:#0a3358}
        .plp-hero-photo img{width:100%;height:100%;object-fit:cover;display:block;opacity:.85}
        @media(max-width:700px){.plp-hero-photo{aspect-ratio:4/3}}
        .plp-trust-strip{background:var(--cream);border-bottom:1px solid var(--line)}
        .plp-trust-inner{display:flex;flex-wrap:wrap;justify-content:center;gap:0}
        .plp-trust-item{padding:18px 26px;font-size:.8rem;font-weight:800;letter-spacing:.03em;color:var(--navy);border-right:1px solid var(--line)}
        .plp-trust-item:last-child{border-right:none}
        @media(max-width:700px){.plp-trust-item{border-right:none;border-bottom:1px solid var(--line);width:100%;text-align:center}}
        .plp-section{padding:64px 0}
        .plp-section-alt{background:var(--cream)}
        .plp-section .container{max-width:1080px}
        .plp-section-narrow .container{max-width:820px}
        .plp-section-narrow{text-align:center}
        .plp-section-narrow p{color:#4a5568;font-size:1rem;line-height:1.75;margin:0 0 16px}
        .plp-tour-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:24px;margin-top:32px}
        .plp-tour-card{background:#fff;border:1px solid var(--line);border-radius:8px;overflow:hidden;text-decoration:none!important;color:inherit!important;display:flex;flex-direction:column;transition:transform .2s,box-shadow .2s}
        .plp-tour-card:hover{transform:translateY(-4px);box-shadow:0 14px 32px rgba(6,36,72,.12)}
        .plp-tour-img{width:100%;aspect-ratio:4/3;overflow:hidden;background:#e4dfd4}
        .plp-tour-img img{width:100%;height:100%;object-fit:cover;display:block}
        .plp-tour-body{padding:20px 22px;display:flex;flex-direction:column;flex:1}
        .plp-tour-best{display:block;color:var(--gold);font-size:.68rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;margin-bottom:8px}
        .plp-tour-body h3{font-family:'Playfair Display',Georgia,serif;color:var(--navy);font-size:1.15rem;margin:0 0 10px;line-height:1.3}
        .plp-tour-body p{color:#5a5a5a;font-size:.87rem;line-height:1.6;margin:0 0 16px;flex:1}
        .plp-tour-link{color:#0d5bc4;font-size:.82rem;font-weight:800}
        table.plp-table{width:100%;border-collapse:collapse;font-size:.92rem;margin-top:28px}
        table.plp-table th{background:var(--navy);color:#fff;padding:11px 16px;text-align:left;font-size:.82rem}
        table.plp-table td{padding:11px 16px;border-bottom:1px solid var(--line)}
        table.plp-table tr:nth-child(even) td{background:#fbf9f5}
        table.plp-table a{color:#0d5bc4;text-decoration:none;font-weight:700}
        table.plp-table a:hover{text-decoration:underline}
        .plp-table-note{font-size:.8rem;color:#8a8a8a;margin-top:10px}
        .plp-pickup-group{margin-top:36px}
        .plp-pickup-label{font-size:.72rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);margin-bottom:16px;display:block}
        .plp-pickup-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px}
        .plp-pickup-card{background:#fff;border:1px solid var(--line);border-radius:8px;overflow:hidden;text-decoration:none!important;color:inherit!important;display:block;transition:transform .2s,box-shadow .2s}
        .plp-pickup-card:hover{transform:translateY(-3px);box-shadow:0 10px 26px rgba(6,36,72,.1)}
        .plp-pickup-img{width:100%;aspect-ratio:16/10;overflow:hidden;background:#e4dfd4}
        .plp-pickup-img img{width:100%;height:100%;object-fit:cover;display:block}
        .plp-pickup-card-body{padding:16px 18px}
        .plp-pickup-card-body h4{font-family:'Playfair Display',Georgia,serif;color:var(--navy);font-size:1rem;margin:0 0 6px}
        .plp-pickup-card-body span{color:#0d5bc4;font-size:.8rem;font-weight:700}
        .plp-traveler-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px;margin-top:28px}
        .plp-traveler-card{background:#fff;border:1px solid var(--line);border-radius:8px;padding:22px}
        .plp-traveler-card h3{font-family:'Playfair Display',Georgia,serif;color:var(--navy);font-size:1.05rem;margin:0 0 10px}
        .plp-traveler-card p{color:#4a5568;font-size:.87rem;line-height:1.6;margin:0}
        .plp-tagline{background:var(--navy);color:#fff;text-align:center;padding:36px 24px;border-radius:8px;margin-top:32px}
        .plp-tagline strong{display:block;font-family:'Playfair Display',Georgia,serif;font-size:1.4rem;color:var(--gold);margin-bottom:8px}
        .plp-tagline span{color:rgba(255,255,255,.75);font-size:.92rem}
        .plp-final-cta{background:var(--navy);color:#fff;text-align:center;padding:82px 0}
        .plp-final-cta .container{max-width:680px}
        .plp-final-cta p.kicker{font-size:.85rem;font-weight:700;color:var(--gold);margin-bottom:12px;letter-spacing:.05em}
        .plp-final-cta h2{font-family:'Playfair Display',Georgia,serif;font-size:clamp(1.7rem,4vw,2.6rem);color:#fff;margin:0 0 16px;line-height:1.2}
        .plp-final-cta p.body{color:rgba(255,255,255,.70);font-size:1rem;line-height:1.7;margin:0 0 32px}
        .plp-final-actions{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
        .why-private-section{padding:0}
        .why-private-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:24px;margin-top:28px}
        .why-private-item h3{font-family:'Playfair Display',Georgia,serif;font-size:1.02rem;color:var(--navy);margin:0 0 8px}
        .why-private-item p{font-size:.86rem;color:#4a5568;line-height:1.6;margin:0}
        .tours-faq-item{border-bottom:1px solid var(--line);padding:18px 0}
        .tours-faq-item:last-child{border-bottom:none}
        .tours-faq-item h3{font-family:'Playfair Display',Georgia,serif;font-size:1.05rem;color:var(--navy);margin:0 0 8px}
        .tours-faq-item p{color:#4a5568;font-size:.92rem;line-height:1.6;margin:0}
        .section-kicker{display:block;color:var(--gold);font-size:.72rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;margin-bottom:10px}
        .section-title{font-family:'Playfair Display',Georgia,serif;color:var(--navy);font-size:clamp(1.5rem,3vw,2rem);margin:0}
        .section-head{margin-bottom:8px}
        .plp-hub-link{background:var(--cream);text-align:center;padding:12px 20px;font-size:.82rem;color:#667085;border-bottom:1px solid var(--line)}
        .plp-hub-link a{color:var(--navy);font-weight:700;text-decoration:none}
        .plp-hub-link a:hover{text-decoration:underline}
        .plp-single-pickup{text-align:center;max-width:760px;margin:0 auto}
        .plp-single-pickup p{color:#4a5568;font-size:1rem;line-height:1.75;margin:0 0 16px}
        .plp-audience-section{padding:0}
        .plp-audience-groups{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px;margin-top:24px}
        .plp-audience-card{background:#fff;border:1px solid var(--line);border-radius:8px;padding:22px}
        .plp-audience-card h3{font-family:'Playfair Display',Georgia,serif;color:var(--navy);font-size:1.02rem;margin:0 0 10px}
        .plp-audience-card p{color:#4a5568;font-size:.87rem;line-height:1.6;margin:0}
        .plp-crosslink{background:var(--cream);border:1px solid var(--line);border-radius:8px;padding:32px;text-align:center;max-width:760px;margin:0 auto}
        .plp-crosslink p{color:#4a5568;font-size:.95rem;line-height:1.7;margin:0 0 18px}
        .plp-journeys-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:22px;margin-top:32px}
        .plp-journey-card{background:#fff;border:1px solid var(--line);border-radius:8px;padding:26px 24px;display:flex;flex-direction:column}
        .plp-journey-card h3{font-family:'Playfair Display',Georgia,serif;color:var(--navy);font-size:1.08rem;margin:0 0 10px}
        .plp-journey-card p{color:#4a5568;font-size:.88rem;line-height:1.65;margin:0 0 16px;flex:1}
        .plp-journey-card a{color:#0d5bc4;font-size:.82rem;font-weight:800;text-decoration:none}
        .plp-journey-card a:hover{text-decoration:underline}
        .plp-custom-block{background:var(--navy);color:#fff;border-radius:8px;padding:44px 36px;text-align:center;max-width:760px;margin:36px auto 0}
        .plp-custom-block h2{font-family:'Playfair Display',Georgia,serif;color:var(--gold);font-size:1.5rem;margin:0 0 14px}
        .plp-custom-block p{color:rgba(255,255,255,.75);font-size:.98rem;line-height:1.75;margin:0 0 22px}
        .plp-subhead{font-family:'Playfair Display',Georgia,serif;color:var(--navy);font-size:1.05rem;margin:26px 0 14px}
        .plp-simple-list{list-style:none;padding:0;margin:0;display:flex;flex-wrap:wrap;gap:10px 28px;justify-content:center}
        .plp-simple-list li{color:#4a5568;font-size:.92rem;padding-left:18px;position:relative;text-align:left}
        .plp-simple-list li:before{content:'\2022';position:absolute;left:0;color:var(--gold);font-weight:800}
        .plp-decision-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:22px;margin-top:32px;text-align:left}
        .plp-decision-col{background:#fff;border:1px solid var(--line);border-radius:8px;padding:24px 26px}
        .plp-decision-col h3{font-family:'Playfair Display',Georgia,serif;color:var(--navy);font-size:1.02rem;margin:0 0 12px}
        .plp-decision-col p{color:#4a5568;font-size:.9rem;line-height:1.65;margin:0}
        .plp-decision-col ul{margin:0;padding-left:20px;color:#4a5568;font-size:.9rem;line-height:1.75}
        .plp-section .btn-secondary{background:transparent;color:var(--navy);border:1.5px solid var(--navy);backdrop-filter:none}
        .plp-section .btn-secondary:hover{background:var(--navy);color:#fff}
    </style>
</head>
